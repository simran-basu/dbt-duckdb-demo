version: 2

models:
  - name: stg_customers
    description: "Cleaned and renamed customer records from the raw seed."
    columns:
      - name: customer_id
        description: "Primary key for customers"
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Customer's name"
        tests:
          - not_null
      - name: region
        description: "Lowercased region"

  - name: stg_orders
    description: "Cleaned order records from the raw seed."
    columns:
      - name: order_id
        description: "Primary key for orders"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_customers"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        description: "Lowercased order status"
        tests:
          - accepted_values:
              values: ['completed', 'pending', 'cancelled']